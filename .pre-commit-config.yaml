repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: openapi

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.15.0
    hooks:
      # Do not use the golangci-lint hook as it only checks vs HEAD so
      # will never find anything in CI.
      - id: golangci-lint-full
        args:
          - "--timeout=5m"
          - "--new-from-merge-base=origin/main"
          # web/node_modules contains some go code that we don't want to lint
          - "./cmd/..."
          - "./internal/..."

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".github/.secrets.baseline"]

  - repo: local
    hooks:
      - id: codegen
        name: codegen
        language: system
        entry: make codegen
        pass_filenames: false
        always_run: true

      - id: go-fmt
        name: go-fmt
        language: system
        entry: gofmt -s -w
        pass_filenames: true
        types: [go]

      - id: go-mod-tidy
        name: go-mod-tidy
        language: system
        entry: go mod tidy
        pass_filenames: false
        types: [go]

      - id: web-lint
        name: web-lint
        language: system
        entry: make web-lint
        pass_filenames: false
        always_run: true

      - id: web-format
        name: web-format
        language: system
        entry: make web-format
        pass_filenames: false
        always_run: true
