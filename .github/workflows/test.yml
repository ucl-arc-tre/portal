---
name: Test
on:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # version 7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # version 6.5.0, See: https://github.com/actions/setup-go/releases
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # version 6.4.0, See: https://github.com/actions/setup-node/releases
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install node dependencies
        working-directory: web
        env:
          # Unit tests use node's test runner, not Cypress, so avoid downloading ~800MB test runner
          CYPRESS_INSTALL_BINARY: 0
        run: npm ci

      - name: Run unit tests
        run: make test-unit

  integration:
    runs-on: ubuntu-latest
    needs: [unit]

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # version 7.0.1
        with:
          persist-credentials: false

      - name: Run integration tests
        run: make test-integration

  e2e:
    runs-on: ubuntu-latest
    environment: e2e
    needs: [unit]

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # version 7.0.1
        with:
          persist-credentials: false

      - name: Create oauth2-proxy config
        run: |
          cat <<EOF > e2e/oauth2-proxy.cfg
          cookie_secret="${{ secrets.OAUTH2PROXY_COOKIE_SECRET }}"
          client_id = "${{ secrets.OAUTH2PROXY_CLIENT_ID }}"
          oidc_issuer_url = "https://login.microsoftonline.com/${{ secrets.OAUTH2PROXY_TENANT_ID }}/v2.0"
          client_secret = "${{ secrets.OAUTH2PROXY_CLIENT_SECRET }}"

          redirect_url = "https://nginx:443/oauth2/callback"
          http_address="0.0.0.0:8080"
          email_domains=["*"]
          cookie_secure="false"
          session_cookie_minimal="true"
          upstreams="http://api:8080/"
          api_routes="/api"

          pass_user_headers = true

          provider = "oidc"
          skip_provider_button = true
          prefer_email_to_user = false
          EOF

      - name: Create config
        run: | # pragma: allowlist secret
          cat <<EOF > e2e/config.yaml
          debug: true
          admin_usernames:
            - portal-e2e-admin@arctretest.onmicrosoft.com
          tre_ops_staff_usernames:
            - portal-e2e-tre@arctretest.onmicrosoft.com
          ig_ops_staff_usernames:
            - portal-e2e-ig@arctretest.onmicrosoft.com
          ig_admin_usernames:
            - portal-e2e-ig-admin@arctretest.onmicrosoft.com
          dsh_ops_staff_usernames:
            - portal-e2e-dsh@arctretest.onmicrosoft.com
          db:
            dsn: host=postgres user=postgres password=postgres dbname=dev sslmode=disable TimeZone=UTC
          s3:
            dev:
              host: s3:8333
            object:
              bucket: bucket-name
              access_key_id: s3
              secret_access_key: s3
            audit:
              bucket: bucket-name
              access_key_id: s3
              secret_access_key: s3
          entra:
            tenant_id: ${{ secrets.OAUTH2PROXY_TENANT_ID }}
            client_id: ${{ secrets.OAUTH2PROXY_CLIENT_ID }}
            client_secret: ${{ secrets.OAUTH2PROXY_CLIENT_SECRET }}
            primary_domain: arctretest.onmicrosoft.com
          tre:
            users: {}
          EOF

      - name: Create cypress env
        run: |
          cat <<EOF > web/cypress.env.json
          {
            "botAdminUsername": "portal-e2e-admin@arctretest.onmicrosoft.com",
            "botAdminPassword": "${{ secrets.CYPRESS_BOT_ADMIN_PASSWORD }}",
            "botBaseUsername": "portal-e2e-base@arctretest.onmicrosoft.com",
            "botBasePassword": "${{ secrets.CYPRESS_BOT_BASE_PASSWORD }}",
            "botStaffUsername": "portal-e2e-staff@arctretest.onmicrosoft.com",
            "botStaffPassword": "${{ secrets.CYPRESS_BOT_STAFF_PASSWORD }}",
            "botStaff2Username": "portal-e2e-staff2@arctretest.onmicrosoft.com",
            "botStaff2Password": "${{ secrets.CYPRESS_BOT_STAFF2_PASSWORD }}",
            "botIGUsername": "portal-e2e-ig@arctretest.onmicrosoft.com",
            "botIGPassword": "${{ secrets.CYPRESS_BOT_IG_PASSWORD }}",
            "botIGAdminUsername": "portal-e2e-ig-admin@arctretest.onmicrosoft.com",
            "botIGAdminPassword": "${{ secrets.CYPRESS_BOT_IG_ADMIN_PASSWORD }}",
            "botTREUsername": "portal-e2e-tre@arctretest.onmicrosoft.com",
            "botTREPassword": "${{ secrets.CYPRESS_BOT_TRE_PASSWORD }}",
            "botDSHUsername": "portal-e2e-dsh@arctretest.onmicrosoft.com",
            "botDSHPassword": "${{ secrets.CYPRESS_BOT_DSH_PASSWORD }}"
          }
          EOF

      # Goal is to keep the Dockerfile's cache mounts (--mount=type=cache) from one CI run to the next.
      #
      # Two tools are needed:
      # - actions/cache saves/restores ordinary directories on the runner between runs, but it
      #   can't reach cache mounts, which live inside BuildKit's own storage.
      # - buildkit-cache-dance copies those runner directories into the cache mounts before the
      #   build, and back out to the directories at the end of the job, so actions/cache can save
      #   them.
      #
      # Go and npm have separate actions/cache steps, because they are keyed on
      # different lockfiles.
      #
      # Relies on buildkit-cache-dance and `docker compose build` both using Docker's "default"
      # builder: adding docker/setup-buildx-action would switch builders and silently bypass this cache.
      - name: Cache Go build cache mounts
        id: go-cache-mounts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # version 6.1.0, See: https://github.com/actions/cache/releases
        with:
          path: go-cache-mounts
          key: docker-go-cache-mounts-${{ hashFiles('go.sum') }}

      - name: Cache npm cache mount
        id: npm-cache-mount
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # version 6.1.0, See: https://github.com/actions/cache/releases
        with:
          path: npm-cache-mount
          key: docker-npm-cache-mount-${{ hashFiles('web/package-lock.json') }}

      - name: Inject cache mounts into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # version 3.4.0, See: https://github.com/reproducible-containers/buildkit-cache-dance/releases
        with:
          # Runner directory -> cache mount target in the Dockerfile.
          cache-map: |
            {
              "go-cache-mounts/go-build": "/root/.cache/go-build",
              "go-cache-mounts/go-mod": "/go/pkg/mod",
              "npm-cache-mount": "/root/.npm"
            }
          # For any given lock file, the buildkit cache contents barely change once created
          # the first time, so no point extracting again from BuildKit back to the GHA runner directory.
          # And cache wouldn't save it anyway, because caches are immutable once created.
          skip-extraction: ${{ steps.go-cache-mounts.outputs.cache-hit == 'true' && steps.npm-cache-mount.outputs.cache-hit == 'true' }}

      - name: Run e2e tests
        run: make test-e2e-release
